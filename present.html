.kit-slot-on { position: absolute; inset: -2px; border-radius: inherit; pointer-events: none;
  border: 2px solid currentColor; box-shadow: 0 0 28px color-mix(in srgb, currentColor 40%, transparent), inset 0 0 44px color-mix(in srgb, currentColor 16%, transparent); }
.scene .kit-slot-on[data-rv] { translate: none; }

/* ---- big arrow ---- */
.kit-arrow { display: block; flex: none; }
.kit-arrow svg { width: 100%; height: 100%; }

/* ---- outcome chip (S10) ---- */
.kit-chip {
  display: inline-flex; align-items: center; gap: 18px; height: 168px; padding: 0 22px 0 44px; border-radius: 28px;
  background: linear-gradient(180deg, rgba(18, 28, 34, .95), rgba(7, 11, 15, .96));
  border: 2px solid rgba(92, 225, 230, .5);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .6), 0 0 36px rgba(92, 225, 230, .16), 0 26px 60px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .08);
}
.kit-chip-t { font: 400 104px/1 var(--font-display); letter-spacing: .05em; color: var(--bone); padding-top: .07em; }
.kit-chip-a { display: block; width: 132px; height: 132px; }
.kit-chip.c-amber { border-color: rgba(242, 163, 58, .6); box-shadow: 0 0 0 1px rgba(0, 0, 0, .6), 0 0 36px rgba(242, 163, 58, .18), 0 26px 60px rgba(0, 0, 0, .55); }

/* ---- dial (S16): only the given values ---- */
.kit-dial { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
.kit-dial.panel { padding: 30px 46px 26px; border-radius: 30px;
  background: radial-gradient(90% 80% at 50% 35%, rgba(26, 22, 18, .95), rgba(8, 8, 11, .95) 75%);
  border: 2px solid rgba(255, 209, 102, .28);
  box-shadow: 0 30px 70px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .07), 0 0 40px rgba(255, 209, 102, .08); }
.kit-dial-l { margin: 0 0 6px; font: 700 52px/1.1 var(--font-body); color: var(--bone); text-align: center; white-space: nowrap;
  text-shadow: 0 2px 3px rgba(0, 0, 0, .6), 0 0 22px rgba(0, 0, 0, .7); }
.kit-needle { position: relative; width: var(--dial-w, 300px); }
.kit-needle svg { display: block; width: 100%; height: auto; }
/* two needles over the art's scale (its own needle hidden): ghost = where it started (from), lit = to, lit arc between */
.kit-dial-base .needle { display: none; }
.kit-dial-over { position: absolute; left: 0; top: 0; width: 100%; height: auto; overflow: visible; }
.kit-dial-over .kit-nd { transform-origin: 120px 136px; }
.kit-dial-over .kit-nd path { fill: none; stroke: var(--accent, currentColor); stroke-width: 8; stroke-linecap: round; }
.kit-dial-over .kit-nd.ghost path { stroke-width: 7; }
.kit-dial-over .kit-nd-ghost { opacity: .35; }
.kit-dial-over .kit-hub { fill: currentColor; }
.kit-dial-over .kit-arc { fill: none; stroke: color-mix(in srgb, currentColor 35%, #fff); stroke-width: 13; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 0; }
/* sweep mode: the lit needle leaves the ghost and sweeps to `to`, the arc draws behind it (same timing) */
.scene .kit-nd-sweep[data-rv], .scene .kit-nd-arc[data-rv] { opacity: 1; translate: none; }
.kit-nd-sweep .kit-nd { transform: rotate(var(--from)); transition: transform calc(.9s * var(--motion, 1)) var(--ease) calc(var(--sweep-d, 500ms) * var(--motion, 1)); }
.kit-nd-sweep[data-rv="on"] .kit-nd, .kit-nd-sweep[data-rv="post"] .kit-nd { transform: rotate(var(--to)); }
.kit-nd-arc[data-rv="pre"] .kit-arc { stroke-dashoffset: 100; }
.kit-nd-arc .kit-arc { transition: stroke-dashoffset calc(.9s * var(--motion, 1)) var(--ease) calc(var(--sweep-d, 500ms) * var(--motion, 1)); }
.kit-dial-v { margin: 6px 0 0; display: flex; align-items: baseline; justify-content: center; gap: 20px; font: 400 116px/1 var(--font-display); color: var(--warn); letter-spacing: .02em;
  text-shadow: 0 0 .1em rgba(255, 209, 102, .35); }
.kit-dial-v .kit-dial-from, .kit-dial-v .kit-dial-to { display: inline-flex; align-items: baseline; gap: 20px; }
.kit-dial-v .kit-dial-w { font: 600 44px/1 var(--font-body); color: var(--bone); letter-spacing: 0; text-shadow: none; }
/* optional group tag before a value (e.g. photo-landscape = control, photo-portrait = women's photos): pictorial, no words */
.kit-dial-tag { display: inline-block; width: 58px; height: 58px; align-self: center; flex: none; }
.kit-dial-tag svg { display: block; width: 100%; height: 100%; }

/* ---- hormone meter (S4, S10): a glass tube, orange neon fill, no scale ---- */
.kit-meter { position: relative; width: 30px; height: 320px; border-radius: 15px; flex: none;
  background: linear-gradient(90deg, #0c0d12, #1a1b24 50%, #0c0d12); border: 2px solid #33343f;
  box-shadow: inset 0 0 10px rgba(0, 0, 0, .8), 0 0 0 1px rgba(0, 0, 0, .5); }
.kit-meter > i { position: absolute; left: 5px; right: 5px; bottom: 5px; top: 5px; border-radius: 10px; transform-origin: 50% 100%;
  background: linear-gradient(0deg, #FF6A1A, #FF9A4D); box-shadow: 0 0 14px rgba(255, 106, 26, .85), 0 0 34px rgba(255, 106, 26, .45); }
.kit-meter > .kit-meter-zero { transform: scaleY(.035); }
.kit-meter > .kit-meter-cap { inset: auto 6px 12px; height: 2px; background: rgba(255, 255, 255, .5); box-shadow: none; transform: none; }
.scene .kit-meter > .kit-meter-twitch[data-rv] { translate: none; transform: scaleY(.035); }
.scene .kit-meter > .kit-meter-twitch[data-rv="on"] { animation: kit-twitch calc(1300ms * var(--motion, 1)) var(--ease) both; }
@keyframes kit-twitch { 0% { transform: scaleY(.035); } 16% { transform: scaleY(.2); } 30% { transform: scaleY(.07); } 46% { transform: scaleY(.15); } 70%, 100% { transform: scaleY(.05); } }
.scene .kit-meter > .kit-meter-rise[data-rv] { opacity: 1; translate: none; transform: scaleY(.035);
  transition-property: opacity, transform; transition-duration: calc(1400ms * var(--motion, 1)); transition-timing-function: cubic-bezier(.3, .7, .2, 1); }
.scene .kit-meter > .kit-meter-rise[data-rv="on"], .scene .kit-meter > .kit-meter-rise[data-rv="post"] { transform: scaleY(.9); opacity: 1; }

/* ---- chain (S10 mediation) ---- */
.kit-chain { display: flex; align-items: center; }
.kit-node {
  font: 400 88px/1 var(--font-display); letter-spacing: .05em; color: var(--bone); padding: 28px 38px 20px; border-radius: 20px;
  background: rgba(8, 10, 14, .9); border: 2px solid rgba(243, 238, 228, .28); white-space: nowrap;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .5);
}
.kit-node.hot { color: var(--warn); border-color: var(--hormone);
  box-shadow: 0 0 0 1px rgba(255, 106, 26, .5), 0 0 46px rgba(255, 106, 26, .5), inset 0 0 34px rgba(255, 106, 26, .2), 0 20px 50px rgba(0, 0, 0, .5); }
/* the link box is tall so the wipe's clip-path (-10% vertical) never cuts the arrowhead */
.kit-link { position: relative; width: 132px; height: 44px; margin: 0 6px; flex: none; color: rgba(243, 238, 228, .6); }
.kit-link::before { content: ''; position: absolute; left: 0; right: 10px; top: 19px; height: 6px; border-radius: 3px; background: currentColor; }
.kit-link::after { content: ''; position: absolute; right: 4px; top: 50%; width: 22px; height: 22px; margin-top: -11px;
  border-top: 6px solid currentColor; border-right: 6px solid currentColor; transform: rotate(45deg); border-radius: 2px; }
.kit-link.hot { color: var(--hormone); filter: drop-shadow(0 0 8px rgba(255, 106, 26, .9)); }

/* ---- question card (S14) ---- */
.kit-card-wrap { perspective: 1800px; }
.kit-card-wrap.auto { position: absolute; left: var(--kit-safe-l); right: var(--kit-safe-r); top: 400px; display: flex; justify-content: center; }
.kit-card {
  display: inline-flex; align-items: center; gap: 40px; padding: 44px 60px 44px 44px; border-radius: 26px; max-width: 1600px;
  background: linear-gradient(180deg, #121b21, #091014); border: 2px solid rgba(92, 225, 230, .5);
  box-shadow: 0 34px 90px rgba(0, 0, 0, .65), 0 0 44px rgba(92, 225, 230, .15), inset 0 1px 0 rgba(255, 255, 255, .08);
  backface-visibility: hidden;
}
.kit-card-i { flex: none; width: 140px; height: 140px; }
.kit-card-i svg { width: 100%; height: 100%; }
.kit-card-t { margin: 0; font: 700 62px/1.16 var(--font-body); color: var(--bone); }
.kit-card-t b { color: var(--lab); font-weight: 700; }
.scene .kit-card.kit-flip[data-rv] { transition-property: opacity, translate, scale, clip-path, rotate; transition-duration: calc(780ms * var(--motion, 1)); }
.scene .kit-card.kit-flip[data-rv="pre"] { opacity: 0; translate: none; rotate: x 86deg; }

/* ---- Peacock inset (S10 b5, S19 b4): a picture-in-picture cut back to the bar ---- */
.kit-inset {
  position: absolute; z-index: 16; padding: 14px 14px 6px; border-radius: 18px;
  background: radial-gradient(90% 90% at 50% 45%, #2a170c, #120b08 70%, #0b0807);
  border: 2px solid rgba(242, 163, 58, .45);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .6), 0 0 40px rgba(242, 163, 58, .12), inset 0 0 40px rgba(0, 0, 0, .5);
}
.kit-inset > svg { width: 100%; height: auto; display: block; }
.kit-inset .peacock .feather.just-lit .n, .kit-inset .peacock .feather.just-dark .n { animation-delay: calc(var(--fdelay, 0ms) * var(--motion, 1)); }
.kit-inset .peacock .spill { display: none; }
/* ---- scenes/s01.css ---- */
/* S1 cold open — every selector scoped to the scene. */
.scene[data-id="S1"] .s1-veil {            /* lights down: the bar is barely there */
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(70% 60% at 50% 52%, rgba(6, 4, 3, .55), rgba(4, 3, 2, .86) 100%);
  transition: opacity calc(900ms * var(--motion)) var(--ease);
}
.scene[data-id="S1"].b1 .s1-veil { opacity: .78; }        /* "Tonight is a movie": the house warms a touch */
.scene[data-id="S1"] .s1-wash {            /* the neon's own light on the backbar (follows the letters on) */
  position: absolute; left: 360px; top: 300px; width: 1200px; height: 560px; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255, 170, 70, .30), rgba(242, 163, 58, .10) 55%, rgba(242, 163, 58, 0));
  animation: art-flicker-on calc(2.1s * var(--motion)) steps(1, end) calc(.35s * var(--motion)) both;
}
.scene[data-id="S1"] .s1-glow {
  position: absolute; left: 560px; top: 430px; width: 800px; height: 300px; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255, 196, 120, .22), rgba(242, 163, 58, 0));
  animation: art-flicker-on calc(2.1s * var(--motion)) steps(1, end) calc(.35s * var(--motion)) both;
}
.scene[data-id="S1"] .s1-title {
  position: absolute; left: 0; right: 0; top: 432px; text-align: center;
  font: 400 var(--fs-hero, 260px)/.9 var(--font-display); letter-spacing: var(--ls-display, .04em); text-transform: uppercase;
}
/* one-shot buzz after the last letter catches: a 2-frame jolt, then still (no loop behind text) */
.scene[data-id="S1"] .s1-title .neon-word { animation: s1-buzz calc(1.6s * var(--motion)) steps(1, end) calc(2.5s * var(--motion)) both; }
@keyframes s1-buzz {
  0% { transform: none; opacity: 1; } 4% { transform: translateX(4px); opacity: .55; } 7% { transform: translateX(-2px); opacity: 1; }
  10% { transform: none; } 46% { opacity: 1; } 49% { opacity: .5; } 52%, 100% { opacity: 1; transform: none; }
}
.scene[data-id="S1"] .s1-counter-glow {    /* the sign's reflection on the lacquered counter top */
  position: absolute; left: 520px; top: 784px; width: 880px; height: 60px; pointer-events: none; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255, 186, 96, .38), rgba(242, 163, 58, 0));
  animation: art-flicker-on calc(2.1s * var(--motion)) steps(1, end) calc(.35s * var(--motion)) both;
}
/* ---- scenes/s02.css ---- */
/* S2 the bar — Danny's entrance, his key light, and the water glass. Transforms / filters only (the engine owns
   translate / scale on reveal elements). */

/* ---- b0: Danny slides in, sits; then a warm key light singles him out (the line is already up) ---- */
.scene[data-id="S2"] .s2-danny {
  animation: s2-danny-in calc(820ms * var(--motion)) var(--ease) calc(120ms * var(--motion)) both,
             s2-danny-key calc(1100ms * var(--motion)) var(--ease) calc(900ms * var(--motion)) both;
}
@keyframes s2-danny-in {            /* slides in from the left, a little bounce, sits */
  0%   { transform: translate(-520px, -26px); opacity: 0; }
  12%  { opacity: 1; }
  58%  { transform: translate(10px, -30px); }
  76%  { transform: translate(0, 10px); }
  90%  { transform: translate(0, -4px); }
  100% { transform: translate(0, 0); opacity: 1; }
}
@keyframes s2-danny-key {           /* rim pulse: up, then settles a touch above the room so he stays the subject */
  0%   { filter: brightness(1) drop-shadow(0 0 0 rgba(255, 184, 96, 0)); }
  35%  { filter: brightness(1.55) drop-shadow(0 0 22px rgba(255, 184, 96, .8)); }
  100% { filter: brightness(1.18) drop-shadow(0 0 10px rgba(255, 184, 96, .42)); }
}
/* the key light itself: a warm pool on the wall behind his head and shoulders (depth 1, behind the cast) */
.scene[data-id="S2"] .s2-key {
  position: absolute; left: 40px; top: 360px; width: 620px; height: 560px; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255, 190, 110, .34), rgba(242, 163, 58, .12) 55%, rgba(242, 163, 58, 0));
  animation: s2-key calc(1100ms * var(--motion)) var(--ease) calc(900ms * var(--motion)) both;
}
@keyframes s2-key { 0% { opacity: 0; } 35% { opacity: 1; } 100% { opacity: .62; } }

/* the bartender steps back into the dark as the light finds Danny (b0), and further when the water comes (b1):
   his own polished glass dims with him, so the only bright glass on the counter is Danny's */
.scene[data-id="S2"] .s2-barman { animation: s2-barman-b0 calc(800ms * var(--motion)) var(--ease) calc(900ms * var(--motion)) both; }
@keyframes s2-barman-b0 { from { filter: brightness(1); } to { filter: brightness(.7); } }
.scene[data-id="S2"].b1 .s2-barman { animation: s2-barman-b1 calc(600ms * var(--motion)) var(--ease) both; }
@keyframes s2-barman-b1 { from { filter: brightness(.7); } to { filter: brightness(.42) saturate(.7); } }

/* ---- b1: the water slides down the counter from the bartender and stops in Danny's hand ---- */
.scene[data-id="S2"] .s2-glass { --rim: #F3EEE4; --glow: #8FF3F6;
  filter: brightness(1.15) drop-shadow(0 0 8px rgba(143, 243, 246, .7)) drop-shadow(0 0 22px rgba(92, 225, 230, .35)); }
.scene[data-id="S2"] .s2-glass[data-rv="on"] {
  animation: s2-glass-in calc(1100ms * var(--motion)) cubic-bezier(.12, .78, .22, 1) both;
}
@keyframes s2-glass-in {
  0%   { transform: translateX(420px); }
  88%  { transform: translateX(-6px) rotate(-2deg); }
  100% { transform: translateX(0) rotate(0); }
}
/* the wet streak it leaves on the lacquer, fading behind it */
.scene[data-id="S2"] .s2-streak {
  position: absolute; left: 390px; top: 793px; width: 440px; height: 8px; border-radius: 4px; pointer-events: none;
  transform-origin: 0 50%;
  background: linear-gradient(90deg, rgba(190, 248, 250, .85), rgba(143, 243, 246, .4) 40%, rgba(143, 243, 246, 0));
  filter: blur(1.5px); opacity: 0;
}
.scene[data-id="S2"].b1 .s2-streak { animation: s2-streak calc(1500ms * var(--motion)) var(--ease) both; }
@keyframes s2-streak {
  0%   { opacity: 0; transform: translateX(400px) scaleX(.15); }
  20%  { opacity: 1; }
  70%  { opacity: .8; transform: translateX(0) scaleX(1); }
  100% { opacity: 0; transform: translateX(0) scaleX(1); }
}
/* the glass catches the light as it stops: one bright flare on its rim, then a soft pool stays under it */
.scene[data-id="S2"] .s2-catch {
  position: absolute; left: 300px; top: 650px; width: 180px; height: 180px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(235, 253, 255, .75), rgba(143, 243, 246, .28) 45%, rgba(143, 243, 246, 0));
  mix-blend-mode: screen; opacity: 0;
}
.scene[data-id="S2"].b1 .s2-catch { animation: s2-catch calc(900ms * var(--motion)) var(--ease) calc(950ms * var(--motion)) both; }
@keyframes s2-catch { 0% { opacity: 0; transform: scale(.4); } 30% { opacity: 1; transform: scale(1.1); } 100% { opacity: .38; transform: scale(.9); } }
/* ---- scenes/s03.css ---- */
/* S3 she walks in. */
/* the door swings to full red light (a second, fully lit copy of the door fades up over the .3 one) */
.scene[data-id="S3"] .s3-door-open { animation: s3-door calc(520ms * var(--motion)) var(--ease) both; }
@keyframes s3-door { 0% { opacity: 0; } 30% { opacity: .8; } 45% { opacity: .55; } 100% { opacity: 1; } }
/* red light spilling into the room from the door, over everything (painted after the desat sheet: it stays red) */
.scene[data-id="S3"] .s3-spill {
  position: absolute; left: 860px; top: 138px; width: 1200px; height: 804px; pointer-events: none; mix-blend-mode: screen;
  background: radial-gradient(60% 70% at 100% 55%, rgba(224, 39, 63, .26), rgba(224, 39, 63, .08) 55%, rgba(224, 39, 63, 0) 80%);
  animation: s3-spill calc(700ms * var(--motion)) var(--ease) both;
}
@keyframes s3-spill { from { opacity: 0; transform: translateX(160px); } to { opacity: 1; transform: none; } }
/* she steps out of the light: from the door, leftwards, then still */
.scene[data-id="S3"] .s3-her { animation: s3-her-in calc(1000ms * var(--motion)) var(--ease) calc(180ms * var(--motion)) both; }
@keyframes s3-her-in { 0% { transform: translateX(230px); opacity: 0; } 25% { opacity: 1; } 100% { transform: none; opacity: 1; } }
/* Danny straightens: a 4-degree rotation about the stool, a beat after she appears */
.scene[data-id="S3"] .s3-danny { transform-origin: 50% 82%;
  animation: s3-straighten calc(520ms * var(--motion)) cubic-bezier(.34, 1.56, .64, 1) calc(900ms * var(--motion)) both; }
@keyframes s3-straighten { from { transform: rotate(0deg); } to { transform: rotate(-4deg); } }
/* ---- scenes/s04.css ---- */
/* S4 the question — a close-up, so the counter is out of shot and the room behind goes soft and dark. */
.scene[data-id="S4"] .kit-counter { display: none; }
.scene[data-id="S4"] .s4-dim { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(5, 4, 4, .72), rgba(5, 4, 4, .5) 55%, rgba(5, 4, 4, .38)); }
.scene[data-id="S4"] .s4-her svg { filter: blur(1.6px); }           /* out of focus: she is far behind him */
.scene[data-id="S4"] .s4-key { position: absolute; left: 1180px; top: 140px; width: 700px; height: 800px; pointer-events: none;
  background: radial-gradient(closest-side, rgba(224, 39, 63, .16), rgba(224, 39, 63, 0)); }
.scene[data-id="S4"] .s4-danny { position: absolute; left: 30px; top: 150px; width: 800px; height: 800px; }
/* the x-ray: faint outlines inside him (brain centre 416,300 r 140; heart 430,700 in the symbol's 800 grid) */
.scene[data-id="S4"] .s4-brain { position: absolute; left: 276px; top: 160px; width: 280px; height: 280px;
  --rim: rgba(243, 238, 228, .38); --fill: rgba(13, 14, 22, .2); opacity: 0;
  animation: s4-xray calc(700ms * var(--motion)) var(--ease) calc(700ms * var(--motion)) both; }
.scene[data-id="S4"] .s4-heart { position: absolute; left: 362px; top: 610px; width: 136px; height: 136px;
  --rim: rgba(242, 163, 58, .6); --fill: rgba(13, 14, 22, .25); --accent: var(--hormone); opacity: 0;
  animation: s4-xray calc(700ms * var(--motion)) var(--ease) calc(950ms * var(--motion)) both; }
.scene[data-id="S4"] .s4-brain svg, .scene[data-id="S4"] .s4-heart svg { width: 100%; height: 100%; display: block; overflow: visible; }
@keyframes s4-xray { from { opacity: 0; } to { opacity: 1; } }
.scene[data-id="S4"] .s4-brain .reward-dot { filter: drop-shadow(0 0 6px #FFD166); }
.scene[data-id="S4"] .s4-brain .reward-dot-halo { transform-origin: 122px 112px; }
/* b1: the reward dot flares once and the heart's trace brightens, as the bar twitches */
.scene[data-id="S4"].b1 .s4-brain .reward-dot-halo { animation: s4-flare calc(1300ms * var(--motion)) var(--ease) both; }
@keyframes s4-flare { 0% { transform: scale(1); opacity: .22; } 35% { transform: scale(2.4); opacity: .55; } 100% { transform: scale(1.4); opacity: .35; } }
.scene[data-id="S4"] .s4-meter { position: absolute; }
/* fix-r1: the SAME tube as S10 b3 (s10.css), scaled 0.61: lit fill resting on a baseline notch at 36 % ("at zero" =
   the resting level S10's tube later rises from). b1 twitches above the notch and settles back on it. */
.scene[data-id="S4"] .s4-meter > .kit-meter-zero { transform: scaleY(.36); opacity: .9; }
.scene[data-id="S4"] .s4-meter > .kit-meter-twitch[data-rv] { transform: scaleY(.36); }
.scene[data-id="S4"] .s4-meter > .kit-meter-twitch[data-rv="on"] { animation: s4-twitch calc(1300ms * var(--motion)) var(--ease) both; }
@keyframes s4-twitch { 0% { transform: scaleY(.36); } 16% { transform: scaleY(.52); } 30% { transform: scaleY(.41); }
  46% { transform: scaleY(.47); } 70%, 100% { transform: scaleY(.37); } }
.scene[data-id="S4"] .s4-meter::after { content: ''; position: absolute; left: -16px; right: -16px; bottom: calc(5px + 36% * .97); height: 3px;
  border-radius: 2px; background: rgba(243, 238, 228, .55); box-shadow: 0 0 6px rgba(0, 0, 0, .8); }
.scene[data-id="S4"] .s4-vignette { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(80% 90% at 30% 55%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, .55)); }
/* the Peacock far behind him, out of focus (no lettering) */
.scene[data-id="S4"] .kit-sign { filter: blur(3px); opacity: .7; }
/* ---- scenes/s05.css ---- */
/* S5 the field — a dolly: pushed in on the sign at b0, pulled back to the wide bar at b1. The camera is a transform
   on each set layer (the engine owns translate / scale on .layer); nearer layers move more = depth. */
.scene[data-id="S5"] .layer.kit-bar { transform-origin: 966px 400px;
  transition: transform calc(900ms * var(--motion)) cubic-bezier(.5, 0, .2, 1); }
.scene[data-id="S5"] .layer.kit-d0 { transform: scale(1.04); }
.scene[data-id="S5"] .layer.kit-d1 { transform: scale(1.06); }
.scene[data-id="S5"] .layer.kit-d2, .scene[data-id="S5"] .layer.kit-hero { transform: scale(1.08); }
.scene[data-id="S5"] .layer.kit-d3 { transform: scale(1.10); }
.scene[data-id="S5"] .layer.kit-d4 { transform: scale(1.13); }
.scene[data-id="S5"].b1 .layer.kit-bar { transform: none; }
/* b0: house lights down, one pool of light on the sign; b1: the lights come back up on the bar */
.scene[data-id="S5"] .s5-spot { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at 972px 350px, rgba(4, 3, 3, 0) 0, rgba(4, 3, 3, .2) 230px, rgba(4, 3, 3, .8) 470px, rgba(4, 3, 3, .86));
  transition: opacity calc(800ms * var(--motion)) var(--ease); }
.scene[data-id="S5"].b1 .s5-spot { opacity: 0; }
/* the idea: the bird's tail fans out, big and bright, over the sign's own (dark) feathers; amber, not the feathers'
   teal, so nobody reads it as the risk counter. Origin = the sign's feather root (986, 365). Scaled .86 from that root
   so the top feather (ink + glow) stays below the letterbox (bar ends y 138; at scale 1 the tip reached y 119, under
   it): it now tops out near y 160, glow near 153, and the fan still grows out of the bird. */
.scene[data-id="S5"] .s5-tail { position: absolute; left: 733px; top: 122px; width: 506px; height: 263px;
  transform-origin: 253px 243px; transform: rotate(36deg) scale(.86);
  color: var(--amber); --accent: var(--warn);
  filter: drop-shadow(0 0 6px rgba(242, 163, 58, .7)) drop-shadow(0 0 22px rgba(242, 163, 58, .35));
  transition: opacity calc(600ms * var(--motion)) var(--ease); }
.scene[data-id="S5"] .s5-tail svg { width: 100%; height: 100%; overflow: visible; display: block; }
.scene[data-id="S5"] .s5-tail .feather-ray { animation-delay: calc((var(--i) * 110ms + 600ms) * var(--motion)); }
.scene[data-id="S5"].b1 .s5-tail { opacity: 0; }
/* the two lines wrap greedily at 900 px ("A peacock's tail is a risk. / It advertises.", "Young men take the most /
   risks of anyone."), not balanced, so each breaks at the phrase; centred, they clear Danny's glass (x 366-414) */
.scene[data-id="S5"] .s5-l { text-wrap: wrap; }
/* ---- scenes/s06.css ---- */
/* S6 audience choice 1. Transforms only on reveal elements (the engine owns translate / scale / clip-path). */

/* ---- the coin: hangs in the light over the bar, centre stage under the sign ---- */
.scene[data-id="S6"] .s6-coin-wrap { position: absolute; left: 895px; top: 572px; width: 130px; height: 130px; perspective: 700px; }
.scene[data-id="S6"] .s6-coin { position: absolute; inset: 0; }
.scene[data-id="S6"] .s6-flip { position: absolute; inset: 0; transform-style: preserve-3d; }
.scene[data-id="S6"] .s6-flip .glint { display: block; --glint-delay: 1.2s; }
.scene[data-id="S6"] .s6-coin-halo { position: absolute; inset: -70px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255, 205, 120, .34), rgba(242, 163, 58, .1) 55%, rgba(242, 163, 58, 0)); }
/* the hover: 2 px over 7 s (ambient motion near text stays under 2 px/s) */
.scene[data-id="S6"] .s6-coin { animation: s6-hover calc(7s * var(--motion)) ease-in-out infinite; }
.rm .scene[data-id="S6"] .s6-coin { animation: none; }
@keyframes s6-hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
.scene[data-id="S6"] .s6-coin-shadow { position: absolute; left: -10px; top: 210px; width: 150px; height: 22px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(0, 0, 0, .6), rgba(0, 0, 0, 0)); opacity: .5; }

/* ---- branch B: the slow-motion toss (0.9 s), then it lands flat on the bar ----
   fix-r1 (2nd pass): TWO full turns (720 deg) with an eased hang at the apex (42-58 %), so it reads as slow motion.
   The coin rests directly under THE PEACOCK lettering (x 798-1120, y 439-528; the coin box starts at 895-1025 x
   572-702), so a straight toss always crosses the words. The toss therefore leaves the light sideways: it travels
   ~290 px to the left with almost no lift (its box stays below y 536 until its right edge is left of x 790), then
   curves up past the left of the sign to the apex (x ~605-735, y ~245) and drops in front of the bartender.
   The rise is a cubic path (0,0) (-290,10) (-298,-40) (-288,-322) sampled every 3 % (linear between samples,
   parameter eased by cubic-bezier(.3,.15,.35,1)); probe: no frame of the coin box touches the lettering + 8 px.
   The shadow lives inside the wrap, so it follows the coin's x for free; its translateY is the wrap's, negated
   (clamped at 0), so it never leaves the counter top at y ~782. */
.scene[data-id="S6"].choice-B.b2 .s6-coin { animation: none; }
.scene[data-id="S6"].choice-B.b2 .s6-coin-wrap { animation: s6-toss calc(900ms * var(--motion)) linear calc(150ms * var(--motion)) both; }
@keyframes s6-toss {
  0%  { transform: translate(0, 0); }
  3%  { transform: translate(-43px, 1px); }
  6%  { transform: translate(-106px, 0); }
  9%  { transform: translate(-174px, -8px); }
  12% { transform: translate(-229px, -28px); }
  15% { transform: translate(-264px, -62px); }
  18% { transform: translate(-281px, -106px); }
  21% { transform: translate(-288px, -152px); }
  24% { transform: translate(-290px, -197px); }
  27% { transform: translate(-290px, -236px); }
  30% { transform: translate(-290px, -268px); }
  33% { transform: translate(-289px, -293px); }
  36% { transform: translate(-288px, -309px); }
  39% { transform: translate(-288px, -319px); }
  42% { transform: translate(-288px, -322px); }
  58% { transform: translate(-282px, -330px); animation-timing-function: cubic-bezier(.55, 0, .85, .45); }
  100% { transform: translate(-260px, 150px); }
}
.scene[data-id="S6"].choice-B.b2 .s6-flip { animation: s6-flip calc(900ms * var(--motion)) linear calc(150ms * var(--motion)) both,
  s6-land calc(260ms * var(--motion)) cubic-bezier(.2, .8, .2, 1) calc(1050ms * var(--motion)) forwards; }
@keyframes s6-flip {
  0%   { transform: rotateX(0deg); animation-timing-function: cubic-bezier(.25, .6, .5, 1); }
  42%  { transform: rotateX(330deg); animation-timing-function: linear; }
  58%  { transform: rotateX(390deg); animation-timing-function: cubic-bezier(.5, 0, .75, .5); }
  100% { transform: rotateX(720deg); }
}
@keyframes s6-land { from { transform: rotateX(720deg) scaleY(1); } 55% { transform: rotateX(720deg) scaleY(.24) translateY(30px); } to { transform: rotateX(720deg) scaleY(.3) translateY(26px); } }
.scene[data-id="S6"].choice-B.b2 .s6-coin-halo { animation: s6-halo-off calc(400ms * var(--motion)) var(--ease) both; }
@keyframes s6-halo-off { to { opacity: .35; } }
.scene[data-id="S6"].choice-B.b2 .s6-coin-shadow { animation: s6-shadow calc(900ms * var(--motion)) linear calc(150ms * var(--motion)) both; }
@keyframes s6-shadow {
  0%  { opacity: .5;  transform: translateY(0) scaleX(1); }
  6%  { opacity: .5;  transform: translateY(0) scaleX(1); }
  9%  { opacity: .49; transform: translateY(8px) scaleX(.99); }
  12% { opacity: .47; transform: translateY(28px) scaleX(.96); }
  15% { opacity: .43; transform: translateY(62px) scaleX(.92); }
  18% { opacity: .38; transform: translateY(106px) scaleX(.86); }
  21% { opacity: .33; transform: translateY(152px) scaleX(.79); }
  24% { opacity: .29; transform: translateY(197px) scaleX(.73); }
  27% { opacity: .24; transform: translateY(236px) scaleX(.68); }
  30% { opacity: .21; transform: translateY(268px) scaleX(.63); }
  33% { opacity: .18; transform: translateY(293px) scaleX(.6); }
  36% { opacity: .16; transform: translateY(309px) scaleX(.58); }
  39% { opacity: .15; transform: translateY(319px) scaleX(.57); }
  42% { opacity: .15; transform: translateY(322px) scaleX(.56); }
  58% { opacity: .14; transform: translateY(330px) scaleX(.55); animation-timing-function: cubic-bezier(.55, 0, .85, .45); }
  100% { opacity: .9; transform: translateY(-150px) scaleX(1); }
}
/* slow motion: the room darkens around the coin's arc while it is in the air */
.scene[data-id="S6"] .s6-slowmo { position: absolute; inset: 0; pointer-events: none; opacity: 0;
