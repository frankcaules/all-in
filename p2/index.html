  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  // QRMode
  //---------------------------------------------------------------------

/* ---- tokens.css ---- */
/* ALL IN — design tokens (palette, type scale, timing). Contract: notes/ARCHITECTURE.md § 4. */
:root {
  /* Palette. TEXT colours (>= 7:1 on ink): bone, amber, lab, money, warn ONLY.
     --her and --hormone are art / neon / meter colours, never text. */
  --ink: #0A0A0F;
  --smoke: #15161F;
  --bone: #F3EEE4;
  --amber: #F2A33A;
  --her: #E0273F;
  --lab: #5CE1E6;
  --hormone: #FF6A1A;
  --money: #7CE07A;
  --warn: #FFD166;
  --night: #0d0e16;          /* silhouette fill */
  --black: #000;

  /* Type */
  --font-display: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
  --font-body: 'Inter', system-ui, 'Segoe UI', Arial, sans-serif;
  --ls-display: .04em;
  --fs-hero: 260px;          /* S1 "ALL IN" */
  --fs-slate: 150px;         /* documentary slates */
  --fs-stamp: 160px;         /* NO EFFECT, STRONG / SHAKY (>= 140) */
  --fs-display: 120px;       /* any Bebas title (>= 110) */
  --fs-line: 72px;           /* the main sentence of a beat (72; one fallback 64) */
  --fs-body: 44px;           /* labels, chips, dial labels (>= 40) */
  --fs-caption: 40px;        /* glossary lower-thirds (>= 40) */
  --fs-ref: 32px;            /* credits references only */

  /* Motion */
  --ease: cubic-bezier(.2, .8, .2, 1);
  --ease-pop: cubic-bezier(.34, 1.56, .64, 1);
  --ease-slam: cubic-bezier(.55, 0, .9, .3);
  --t-reveal: 560ms;
  --t-enter: 350ms;
  --t-bars: 400ms;
  --motion: 1;               /* x0.3 under reduced motion (.rm on <html>) */

  /* Frame */
  --bar-h: 138px;            /* 2.39:1 letterbox inside 1920x1080 */
}
html.rm { --motion: .3; }
/* ---- base.css ---- */
/* ALL IN — base: stage, moods, letterbox, grain, vignette, light leak, layers, reveals, overlays.
   Contract: notes/ARCHITECTURE.md sections 2-4. */

@property --d   { syntax: '<time>'; inherits: false; initial-value: 0ms; }
@property --dur { syntax: '<time>'; inherits: false; initial-value: 560ms; }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body {
  color: var(--bone);
  font-family: var(--font-body);
  font-weight: 600;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-kerning: normal;
}
html.nocursor, html.nocursor * { cursor: none !important; }

/* ---------- stage ---------- */
#viewport { position: fixed; inset: 0; background: #000; overflow: hidden; }
#stage {
  position: absolute; left: 50%; top: 50%;
  width: 1920px; height: 1080px;
  transform: translate(-50%, -50%);
  transform-origin: 50% 50%;
  overflow: hidden;
  background: var(--ink);
  font-size: var(--fs-body);
  line-height: 1.2;
  contain: layout paint style;
  isolation: isolate;
}
#stage[data-mood="black"], #stage[data-mood="credits"] { background: #000; }
#stage[data-mood="room"] { background: #0c0d12; }

#scenes { position: absolute; inset: 0; z-index: 1; }
.scene { position: absolute; inset: 0; overflow: hidden; }
.layer { position: absolute; inset: 0; }
.layer.bleed { inset: 0 -80px; }               /* full-bleed art that survives the parallax push */
.layer[data-depth="0"] { transform-origin: 50% 50%; }
/* bw mood: greyscale is applied per top-level child of the scene (not on #scenes), so a direct child of .scene with
   class .keep-colour escapes it — S19's Peacock sign is the ONLY colour in the black-and-white world.
   .keep-colour only works on a DIRECT child of .scene (a .layer or an absolutely positioned wrapper); inside a
   greyscaled layer it cannot escape (filters compose). */
#stage[data-mood="bw"] .scene > :not(.keep-colour) { filter: grayscale(1) contrast(1.1); }

/* ---------- mood grades (low alpha, normal blend: cheap on any GPU) ---------- */
#fx-grade { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
#fx-grade > i { position: absolute; inset: 0; opacity: 0; transition: opacity calc(600ms * var(--motion)) var(--ease); }
#fx-grade .g-bar  { background: radial-gradient(120% 90% at 50% 20%, rgba(242,163,58,.07), rgba(242,163,58,0) 60%), linear-gradient(180deg, rgba(60,30,8,.10), rgba(0,0,0,0) 40%, rgba(40,16,4,.12)); }
#fx-grade .g-lab  { background: linear-gradient(180deg, rgba(92,225,230,.06), rgba(92,225,230,.025) 55%, rgba(10,30,40,.10)); }
#fx-grade .g-case { background: radial-gradient(90% 90% at 25% 50%, rgba(242,163,58,.045), rgba(0,0,0,0) 60%), radial-gradient(90% 90% at 75% 50%, rgba(92,225,230,.045), rgba(0,0,0,0) 60%); }
#fx-grade .g-room { background: radial-gradient(120% 100% at 50% 0%, rgba(243,238,228,.035), rgba(0,0,0,0) 60%); }
#fx-grade .g-bw   { background: rgba(255,255,255,.02); animation: bw-flicker 1.6s steps(1, end) infinite; }
#stage[data-mood="bar"] .g-bar, #stage[data-mood="lab"] .g-lab, #stage[data-mood="case"] .g-case,
#stage[data-mood="room"] .g-room, #stage[data-mood="bw"] .g-bw { opacity: 1; }
@keyframes bw-flicker {
  0% { background: rgba(255,255,255,.02); } 13% { background: rgba(255,255,255,.045); } 19% { background: rgba(0,0,0,.03); }
  41% { background: rgba(255,255,255,.015); } 58% { background: rgba(255,255,255,.04); } 77% { background: rgba(0,0,0,.02); }
}

/* ---------- grain / vignette / leak ---------- */
#fx-grain {
  position: absolute; inset: -96px; z-index: 3; pointer-events: none;
  opacity: .05; background-repeat: repeat; background-size: 256px 256px;
  animation: grain-jitter 1s steps(1, end) infinite;
}
@keyframes grain-jitter {
  0%    { transform: translate(0, 0); }
  12.5% { transform: translate(-41px, 23px); }
  25%   { transform: translate(37px, -55px); }
  37.5% { transform: translate(-63px, -17px); }
  50%   { transform: translate(19px, 61px); }
  62.5% { transform: translate(-29px, -71px); }
  75%   { transform: translate(67px, 11px); }
  87.5% { transform: translate(-7px, 47px); }
}
#stage[data-mood="black"] #fx-grain { opacity: .03; }
#fx-vignette {
  position: absolute; inset: 0; z-index: 4; pointer-events: none;
  background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.38) 85%, rgba(0,0,0,.62) 100%);
}
#fx-leak {
  position: absolute; inset: 0; z-index: 5; pointer-events: none; opacity: 0;
  mix-blend-mode: screen;
  background:
    radial-gradient(55% 75% at var(--lx, 18%) 35%, rgba(242,163,58,.95), rgba(242,163,58,0) 62%),
    radial-gradient(45% 60% at calc(100% - var(--lx, 18%)) 72%, rgba(224,39,63,.55), rgba(224,39,63,0) 60%),
    linear-gradient(100deg, rgba(255,214,150,.25), rgba(0,0,0,0) 45%);
}

/* ---------- documentary frame (lab mood): corner marks + REC dot (the kit adds edge ticks and a level meter) ---------- */
#fx-doc { position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0; transition: opacity calc(300ms * var(--motion)) var(--ease); }
#stage[data-mood="lab"] #fx-doc { opacity: 1; }
#fx-doc .cm { position: absolute; width: 48px; height: 48px; border: 0 solid rgba(92,225,230,.75); }
#fx-doc .cm.tl { left: 36px;  top: 36px;    border-left-width: 4px;  border-top-width: 4px; }
#fx-doc .cm.tr { right: 36px; top: 36px;    border-right-width: 4px; border-top-width: 4px; }
#fx-doc .cm.bl { left: 36px;  bottom: 36px; border-left-width: 4px;  border-bottom-width: 4px; }
#fx-doc .cm.br { right: 36px; bottom: 36px; border-right-width: 4px; border-bottom-width: 4px; }
#fx-doc .rec {
  position: absolute; left: 104px; top: 32px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--her); box-shadow: 0 0 14px rgba(224,39,63,.8);
  animation: rec-blink 2s steps(1, end) infinite;
}
@keyframes rec-blink { 0% { opacity: 1; } 50% { opacity: .2; } }
/* no timecode digits: a running HH:MM:SS:FF would put numbers that are not in the brief on screen (constraint 7) */

/* ---------- letterbox (2.39:1) ---------- */
#fx-bars { position: absolute; inset: 0; z-index: 7; pointer-events: none; }
#fx-bars .lb {
  position: absolute; left: 0; right: 0; height: var(--bar-h); background: #000;
  transform: scaleY(0);
  transition: transform calc(var(--t-bars) * var(--motion)) var(--ease);
}
#fx-bars .lb-top { top: 0; transform-origin: 50% 0; }
#fx-bars .lb-bot { bottom: 0; transform-origin: 50% 100%; }
#stage[data-mood="bar"] .lb, #stage[data-mood="case"] .lb,
#stage[data-mood="bw"] .lb, #stage[data-mood="credits"] .lb { transform: scaleY(1); }

/* snapping (backward / jump / export): no transitions anywhere in the frame */
#stage.snap #fx-bars .lb, #stage.snap #fx-grade > i, #stage.snap #fx-doc { transition: none !important; }
.scene.instant, .scene.instant * { transition: none !important; }

/* ---------- reduced motion: ambient loops frozen, reveals still happen (x0.3) ---------- */
html.rm #fx-grain, html.rm #fx-doc .rec, html.rm #fx-grade .g-bw,
html.rm .loop, html.rm [data-loop] { animation-play-state: paused !important; }

/* ---------- declarative reveals (engine sets data-rv = pre | on | post | off) ---------- */
.scene [data-rv] {
  transition-property: opacity, translate, scale, clip-path;
  transition-duration: calc(var(--dur) * var(--motion));
  transition-delay: calc(var(--d) * var(--motion));
  transition-timing-function: var(--ease);
}
.scene [data-rv="off"] { display: none !important; }
.scene [data-rv="pre"]  { opacity: 0; translate: 0 24px; }                 /* rise (default) */
.scene [data-rv="pre"][data-fx="fade"],
.scene [data-rv="pre"][data-fx="flicker"],
.scene [data-rv="pre"][data-fx="wipe"] { translate: none; }
.scene [data-rv="pre"][data-fx="drop"]    { translate: 0 -24px; }
.scene [data-rv="pre"][data-fx="slide-l"] { translate: -64px 0; }
.scene [data-rv="pre"][data-fx="slide-r"] { translate: 64px 0; }
.scene [data-rv="pre"][data-fx="pop"]     { translate: none; scale: .82; }
.scene [data-rv][data-fx="pop"]           { transition-timing-function: var(--ease-pop); }
.scene [data-rv="pre"][data-fx="scale"]   { translate: none; scale: .94; }
.scene [data-rv="pre"][data-fx="stamp"]   { translate: none; }
.scene [data-rv="pre"][data-fx="wipe"]    { opacity: 1; clip-path: inset(-10% 100% -10% 0); }
.scene [data-rv="on"][data-fx="wipe"], .scene [data-rv="post"][data-fx="wipe"] { clip-path: inset(-10% 0 -10% 0); }
.scene [data-rv][data-fx="wipe"] { transition-timing-function: cubic-bezier(.65, 0, .25, 1); }
.scene [data-rv="on"][data-fx="flicker"] {
  animation: rv-flicker calc(var(--dur) * 1.4 * var(--motion)) linear calc(var(--d) * var(--motion)) backwards;
}
.scene [data-rv="on"][data-fx="stamp"] {
  animation: rv-stamp calc(var(--dur) * .6 * var(--motion)) var(--ease-slam) calc(var(--d) * var(--motion)) backwards;
}
.scene [data-rv="post"] {
  opacity: 0; translate: 0 -14px;
  transition-duration: calc(var(--dur) * .6 * var(--motion));
  transition-delay: 0ms;
}
.scene [data-rv="post"][data-fx="fade"] { translate: none; }
/* cut:'hard' entry (engine adds .hardcut for the entry frame): a reveal with no delay of its own is present on frame 1
   (min() = 0 when --d is 0); delayed reveals keep their transition. Keyframe effects (flicker, stamp, clap) still play. */
.scene.hardcut [data-rv] { transition-duration: min(calc(var(--d) * 1000), calc(var(--dur) * var(--motion))); }
@keyframes rv-flicker {
  0% { opacity: 0; } 6% { opacity: .85; } 10% { opacity: .1; } 17% { opacity: .9; } 21% { opacity: .25; }
  34% { opacity: 1; } 40% { opacity: .45; } 46% { opacity: 1; } 100% { opacity: 1; }
}
@keyframes rv-stamp {
  0% { opacity: 0; scale: 1.9; } 55% { opacity: 1; scale: .94; } 75% { scale: 1.03; } 100% { opacity: 1; scale: 1; }
}

/* ---------- type helpers (optional; sizes per the type scale) ---------- */
.t-hero, .t-slate, .t-display, .t-stamp {
  font-family: var(--font-display); font-weight: 400; text-transform: uppercase;
  letter-spacing: var(--ls-display); line-height: .92; margin: 0;
}
.t-hero    { font-size: var(--fs-hero); }
.t-slate   { font-size: var(--fs-slate); }
.t-display { font-size: var(--fs-display); }
.t-stamp   { font-size: var(--fs-stamp); }
.t-line    { font: 700 var(--fs-line)/1.12 var(--font-body); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.t-body    { font: 600 var(--fs-body)/1.25 var(--font-body); margin: 0; }
.t-label   { font: 700 var(--fs-body)/1.1 var(--font-body); text-transform: uppercase; letter-spacing: .08em; margin: 0; }
.t-caption { font: 600 var(--fs-caption)/1.2 var(--font-body); color: var(--amber); margin: 0; }
.t-amber { color: var(--amber); } .t-lab { color: var(--lab); } .t-money { color: var(--money); } .t-warn { color: var(--warn); } .t-bone { color: var(--bone); }
/* glossary lower-third: <p class="lower-third" data-wc="caption">costly signalling</p> */
.lower-third {
  position: absolute; left: 120px; bottom: 186px; margin: 0;
  font: 600 var(--fs-caption)/1.2 var(--font-body); color: var(--amber);
  padding: 10px 22px 12px 26px; border-left: 4px solid var(--amber);
  background: linear-gradient(90deg, rgba(10,10,15,.88), rgba(10,10,15,0));
}
#stage[data-mood="lab"] .lower-third, #stage[data-mood="room"] .lower-third { bottom: 96px; left: 96px; }
/* text over art: soft dark scrim behind it */
.scrim { position: relative; isolation: isolate; }
.scrim::before {
  content: ''; position: absolute; inset: -40px -80px; z-index: -1; pointer-events: none;
  background: radial-gradient(closest-side, rgba(10,10,15,.82), rgba(10,10,15,.55) 60%, rgba(10,10,15,0));
}
/* the mood's text-safe area as an absolute box */
.safe { position: absolute; left: 120px; top: 170px; width: 1680px; height: 740px; }
#stage[data-mood="lab"] .safe, #stage[data-mood="room"] .safe, #stage[data-mood="black"] .safe { left: 96px; top: 72px; width: 1728px; height: 936px; }
.center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.stack > * + * { margin-top: 28px; }

/* ---------- ring countdown (ctx.ring) ---------- */
.ring { position: relative; width: 220px; height: 220px; }
.ring .ring-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring .ring-track { fill: none; stroke: rgba(243,238,228,.14); stroke-width: 10; }
.ring .ring-prog  { fill: none; stroke: var(--ring-color, var(--lab)); stroke-width: 10; stroke-linecap: round; filter: drop-shadow(0 0 6px rgba(92,225,230,.55)); }
.ring.ring-low .ring-prog { stroke: var(--warn); filter: drop-shadow(0 0 6px rgba(255,209,102,.6)); }
.ring.ring-done .ring-prog { opacity: 0; }
.ring .ring-num {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font: 400 var(--ring-num, 96px)/1 var(--font-display); letter-spacing: .02em; color: var(--bone);
  padding-top: .06em;
}
.ring.ring-low .ring-num { color: var(--warn); }

/* ======================================================================
   Presenter overlays inside the stage (poll, notes, jump, hint)
   ====================================================================== */
.ov { position: absolute; inset: 0; z-index: 40; opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity calc(260ms * var(--motion)) var(--ease), visibility 0s linear calc(260ms * var(--motion)); }
.ov.open { opacity: 1; visibility: visible; transition: opacity calc(260ms * var(--motion)) var(--ease), visibility 0s; }

/* ---- S0 load hint ---- */
#hint {
  position: absolute; left: 0; right: 0; top: 50%; z-index: 30; transform: translateY(-50%);
  text-align: center; font: 500 40px/1.3 var(--font-body); color: var(--bone); letter-spacing: .01em;
  opacity: 0; pointer-events: none;
}
#hint.show { opacity: 1; transition: opacity calc(500ms * var(--motion)) var(--ease); }
#hint.dim  { opacity: .08; transition: opacity calc(1600ms * var(--motion)) ease-in-out; }

/* ---- poll board (seen by the whole class) ---- */
#ov-poll {
  z-index: 50;
  background:
    radial-gradient(70% 60% at 50% 38%, rgba(242,163,58,.07), rgba(242,163,58,0) 70%),
    radial-gradient(ellipse at 50% 45%, #15161F, #08080C 75%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 72px 96px 96px;
}
#ov-poll .poll-kicker {
  font: 400 60px/1 var(--font-display); letter-spacing: .22em; color: var(--amber);
  display: flex; align-items: center; gap: 28px; padding-top: .05em;
}
#ov-poll .poll-kicker::before, #ov-poll .poll-kicker::after { content: ''; width: 120px; height: 2px; background: linear-gradient(90deg, rgba(242,163,58,0), rgba(242,163,58,.8)); }
#ov-poll .poll-kicker::after { transform: scaleX(-1); }
#ov-poll .poll-q {
  margin: 36px 0 0; max-width: 1560px; text-align: center; text-wrap: balance;
  font: 700 66px/1.14 var(--font-body); letter-spacing: -.012em; color: var(--bone);
}
#ov-poll .poll-cols { display: flex; justify-content: center; align-items: stretch; margin-top: 72px; }
#ov-poll .poll-col {
  position: relative; width: 560px; padding: 0 40px; display: flex; flex-direction: column; align-items: center;
  border-left: 2px solid rgba(243,238,228,.10);
}
#ov-poll .poll-cols.n3 .poll-col { width: 540px; }
#ov-poll .poll-col:first-child { border-left: 0; }
#ov-poll .poll-label { font: 400 112px/1 var(--font-display); letter-spacing: .06em; color: var(--amber); padding-top: .04em; }
#ov-poll .poll-sub { margin-top: 10px; font: 600 42px/1.2 var(--font-body); color: var(--bone); text-align: center; }
#ov-poll .poll-nums { display: flex; align-items: flex-end; justify-content: center; gap: 48px; margin-top: 18px; }
#ov-poll .poll-count {
  display: block; font: 400 300px/.86 var(--font-display); color: var(--bone); letter-spacing: .01em;
  font-variant-numeric: tabular-nums; padding-top: .06em; transition: color .3s, text-shadow .3s;
}
#ov-poll .poll-col.lead .poll-count { color: var(--amber); text-shadow: 0 0 60px rgba(242,163,58,.35); }
#ov-poll .poll-col.lead::before {
  content: ''; position: absolute; top: -30px; left: 50%; width: 120px; height: 6px; margin-left: -60px; border-radius: 3px;
  background: var(--amber); box-shadow: 0 0 24px rgba(242,163,58,.7);
}
/* compare board (S22): Before | arrow | After per option, both tallies the SAME size so a shift reads the right way;
   Before is dimmed by colour (#B3ADA3: ≥ 7.3:1 even under the board's amber glow, ≈ 8:1 on its body), After is bone (amber when leading). */
#ov-poll .poll-nums.cmp {
  display: grid; grid-template-columns: auto auto auto; grid-template-rows: auto auto; column-gap: 22px; row-gap: 6px;
  justify-items: center; align-items: center; margin-top: 30px;
}
#ov-poll .pc-tag { grid-row: 1; font: 700 40px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--lab); }
#ov-poll .pc-tag.pc-b { grid-column: 1; }
#ov-poll .pc-tag.pc-a { grid-column: 3; color: var(--amber); }
#ov-poll .cmp .pc-bnum, #ov-poll .cmp .poll-count { grid-row: 2; font: 400 196px/.86 var(--font-display); padding: .06em 0 .02em; }
#ov-poll .pc-bnum { display: block; grid-column: 1; color: #B3ADA3; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
#ov-poll .cmp .poll-count { grid-column: 3; }
#ov-poll .pc-arrow { grid-row: 2; grid-column: 2; position: relative; width: 54px; height: 26px; margin-bottom: .2em; color: rgba(243,238,228,.5); }
#ov-poll .pc-arrow::before { content: ''; position: absolute; left: 0; right: 12px; top: 11px; height: 4px; border-radius: 2px; background: currentColor; }
#ov-poll .pc-arrow::after { content: ''; position: absolute; right: 3px; top: 50%; width: 16px; height: 16px; margin-top: -8px;
  border-top: 4px solid currentColor; border-right: 4px solid currentColor; transform: rotate(45deg); border-radius: 1px; }
/* keycap hints (presenter aid): dim, and gone ~2 s after the board opens (.keys-off) so the room never reads them */
#ov-poll .poll-key {
  margin-top: 30px; min-width: 64px; height: 64px; padding: 0 16px; border-radius: 12px;
  border: 2px solid rgba(243,238,228,.16); color: rgba(243,238,228,.4);
  font: 700 40px/60px var(--font-body); text-align: center; opacity: .6; transition: opacity .8s ease-out;
}
#ov-poll.keys-off .poll-key { opacity: 0; }

/* ---- rehearsal notes (N) ---- */
#ov-notes {
  z-index: 60; background: linear-gradient(90deg, rgba(8,8,12,.985) 0%, rgba(8,8,12,.975) 62%, rgba(8,8,12,.94) 100%);
  padding: 72px 96px; color: var(--bone);
}
#ov-notes .nt-flag { position: absolute; right: 96px; top: 72px; font: 700 28px/1 var(--font-body); letter-spacing: .14em; color: var(--warn); border: 2px solid var(--warn); border-radius: 8px; padding: 10px 14px; }
#ov-notes .nt-head { display: flex; align-items: baseline; gap: 40px; }
#ov-notes .nt-id { font: 400 200px/.85 var(--font-display); color: var(--amber); letter-spacing: .02em; }
#ov-notes .nt-title { font: 400 104px/.95 var(--font-display); letter-spacing: var(--ls-display); text-transform: uppercase; max-width: 1200px; }
#ov-notes .nt-meta { display: flex; flex-wrap: wrap; gap: 14px 56px; margin-top: 40px; }
#ov-notes .nt-meta div { display: flex; flex-direction: column; }
#ov-notes .nt-meta b { font: 700 24px/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: rgba(243,238,228,.55); margin-bottom: 10px; }
#ov-notes .nt-meta span { font: 400 64px/1 var(--font-display); letter-spacing: .03em; }
#ov-notes .nt-meta .is-late { color: var(--warn); }
#ov-notes .nt-cue { margin-top: 44px; font: 700 54px/1.15 var(--font-body); color: var(--warn); }
#ov-notes .nt-keys { margin-top: 18px; font: 600 38px/1.2 var(--font-body); color: var(--lab); }
#ov-notes .nt-notes { margin-top: 30px; max-width: 1560px; font: 500 36px/1.4 var(--font-body); color: rgba(243,238,228,.92); }
#ov-notes .nt-next { position: absolute; left: 96px; right: 96px; bottom: 64px; padding-top: 22px; border-top: 2px solid rgba(243,238,228,.12);
  font: 600 34px/1.2 var(--font-body); color: rgba(243,238,228,.75); }
#ov-notes .nt-next em { font-style: normal; color: var(--amber); font-weight: 700; }

/* ---- jump (G) ---- */
#ov-jump { z-index: 70; background: rgba(6,6,9,.8); display: flex; align-items: center; justify-content: center; }
#ov-jump .jp-card {
  width: 980px; padding: 56px 72px 48px; border-radius: 28px; text-align: center;
  background: linear-gradient(180deg, #15161F, #0d0e16); border: 2px solid rgba(242,163,58,.35);
  box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03) inset;
}
#ov-jump .jp-k { font: 400 60px/1 var(--font-display); letter-spacing: .22em; color: var(--amber); padding-top: .05em; }
#ov-jump .jp-row { display: flex; align-items: center; justify-content: center; width: max-content; margin: 26px auto 0; padding: 0 20px; border-bottom: 4px solid var(--amber); }
#ov-jump .jp-s { font: 400 220px/1 var(--font-display); color: rgba(243,238,228,.35); padding-top: .04em; }
#ov-jump input {
  width: 190px; background: transparent; border: 0; outline: 0; color: var(--bone);
  font: 400 220px/1 var(--font-display); text-align: left; caret-color: var(--amber); padding: .04em 0 0; margin: 0;
}
#ov-jump .jp-prev { margin-top: 30px; min-height: 1.3em; font: 600 44px/1.3 var(--font-body); color: var(--bone); }
#ov-jump .jp-prev.bad { color: var(--warn); }
#ov-jump .jp-hint { margin-top: 18px; font: 600 28px/1.2 var(--font-body); color: rgba(243,238,228,.5); letter-spacing: .04em; }
#ov-jump.shake .jp-card { animation: jp-shake .32s linear; }
@keyframes jp-shake { 20% { transform: translateX(-14px); } 40% { transform: translateX(12px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(5px); } }

/* ======================================================================
   Viewport-level presenter UI (not scaled with the stage)
   ====================================================================== */
#blackout { position: fixed; inset: 0; z-index: 900; background: #000; opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s linear .25s; }
#blackout.on { opacity: 1; visibility: visible; transition: opacity .25s, visibility 0s; }
#timer {
  position: fixed; right: 18px; bottom: 12px; z-index: 950;
  font: 600 28px/1 var(--font-body); font-variant-numeric: tabular-nums; letter-spacing: .03em;
  color: var(--bone); opacity: .6; display: none; pointer-events: none;
  padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,.35);
}
#timer.visible { display: block; }
#timer.amber { color: var(--amber); }
#timer.red   { color: #FF4B5C; }
#focus-ind {
  position: fixed; left: 16px; bottom: 12px; z-index: 950;
  font: 600 28px/1 var(--font-body); color: var(--bone); opacity: 0; pointer-events: none;
  padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,.35); transition: opacity .2s;
}
#focus-ind.on { opacity: .6; }
#focus-ind .dot { color: var(--warn); }
/* presenter feedback ("Timer reset", "Neon buzz on"): small, half strength, in the bottom-right corner beside the
   timer (letterbox / frame edge), never across the film */
#toast {
  position: fixed; right: 132px; bottom: 12px; z-index: 950;
  font: 600 28px/1 var(--font-body); letter-spacing: .02em; color: var(--bone); opacity: 0; pointer-events: none;
  padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,.35); transition: opacity .2s; white-space: nowrap;
}
#toast.on { opacity: .5; }
html.shot #focus-ind, html.shot #toast { display: none !important; }

/* S22 re-vote before compareBeat: one After column per option (Before slides in at compareBeat) */
#ov-poll .poll-nums.cmp.solo { grid-template-columns: auto; }
#ov-poll .poll-nums.cmp.solo .pc-tag.pc-a, #ov-poll .poll-nums.cmp.solo .poll-count { grid-column: 1; }

/* Shown only if the inline script never booted (e.g. a typo while pasting the form link breaks the EDIT ME line).
   ALLIN.boot() removes it; the 1.5 s delay means it never flashes on a normal load. */
#boot-fail {
  position: fixed; inset: 0; z-index: 990; display: flex; align-items: center; justify-content: center; padding: 6vh 8vw;
  background: #000; color: #F3EEE4; text-align: center; font: 600 clamp(18px, 2.4vw, 40px)/1.4 'Inter', system-ui, 'Segoe UI', Arial, sans-serif;
  opacity: 0; animation: boot-fail-in .4s ease-out 1.5s forwards;
}
#boot-fail p { max-width: 1100px; margin: 0; }
#boot-fail b { color: #FFD166; }
@keyframes boot-fail-in { to { opacity: 1; } }
/* ---- art/art.css ---- */
/* src/art/art.css — shared art styling. Scene CSS stays scoped under .scene[data-id="Sx"]; everything here is global
   but only matches art classes. Glows are SVG filters / text-shadow on small elements only. */

/* ---------- base ---------- */
svg.art { display: block; overflow: visible; }
svg.art.set { width: 100%; height: 100%; }
.flip { transform: scaleX(-1); }                       /* mirror a character (the rim side mirrors too) */

/* colour hooks: put on any ancestor of a <use>; custom properties inherit into the symbol */
.rim-amber { --rim: var(--amber, #F2A33A); }
.rim-her   { --rim: var(--her, #E0273F); }
.rim-lab   { --rim: var(--lab, #5CE1E6); }
.rim-bone  { --rim: var(--bone, #F3EEE4); }
.rim-money { --rim: var(--money, #7CE07A); }
.rim-warn  { --rim: var(--warn, #FFD166); }
.rim-hormone { --rim: var(--hormone, #FF6A1A); }
.glow-her  { --glow: var(--her, #E0273F); }
.glow-lab  { --glow: var(--lab, #5CE1E6); }
.glow-amber { --glow: var(--amber, #F2A33A); }
.unlit     { --rim: #2a2b36; }                         /* silhouette with its rim switched off (deep shadow) */

/* ---------- icon light grammar (props + icons) ----------
   Icons are never flat line art on ink. Before their beat they are dark glass (.icon-glass); on their beat they light
   like the Peacock's feathers (.icon-lit + .just-lit plays the same flicker-on). Colour comes from `color:` / --rim
   (or --glow for the halo only). Put them over the scene's set at data-depth >= 2. Small elements only (drop-shadow cost
   is per element); in crowded frames (S18) add .icon-lit-soft to cap the outer bloom. */
svg.art.icon-glass { --rim: #2a2b36; --accent: #2a2b36; --fill: #07090d; --glow: #2a2b36; --screen: #0b0b10; --screen-fig: #2a2b36;
  filter: grayscale(.85) brightness(.45); }   /* static filter: also darkens the semantic coin / chip colours */
svg.art.icon-lit {
  --fill: #07090d;
  filter: drop-shadow(0 0 1.5px rgba(255, 255, 255, .85))
          drop-shadow(0 0 9px var(--glow, var(--rim, currentColor)))
          drop-shadow(0 0 var(--lit-bloom, 26px) color-mix(in srgb, var(--glow, var(--rim, currentColor)) 45%, transparent));
}
svg.art.icon-lit.icon-lit-soft { --lit-bloom: 14px; }
svg.art.icon-lit.just-lit { animation: art-flicker-on calc(1s * var(--motion, 1)) steps(1, end) both; }

/* neon glow for SMALL elements (icons, chips, a coin). Never on full-frame layers. */
.neon-glow { filter: drop-shadow(0 0 4px var(--glow, var(--rim, currentColor))) drop-shadow(0 0 14px var(--glow, var(--rim, currentColor))); }
.neon-text { text-shadow: 0 0 .04em #fff, 0 0 .12em var(--glow, #F2A33A), 0 0 .4em var(--glow, #F2A33A); }

/* long cast shadow for a backlit figure: put a SECOND copy of the figure in a wrapper with this class, same box,
   directly under the first. Small elements only. */
.cast-shadow { --rim: #000; --fill: #000; opacity: .42; transform-origin: 50% 100%; transform: scaleY(-.28) skewX(48deg); filter: blur(1.5px); }

/* ---------- THE PEACOCK sign ---------- */
.peacock { display: block; overflow: visible; }
.peacock .backer { fill: #09080c; fill-opacity: .82; stroke: #2a2833; stroke-width: 2; }
.peacock .standoffs circle { fill: #3a3843; }
.peacock.no-backer .backer, .peacock.no-backer .standoffs { display: none; }
.peacock .g, .peacock .gh, .peacock .t, .peacock .k { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.peacock .g  { stroke: #24232c; stroke-width: 10; }            /* dark glass tube */
.peacock .gh { stroke: #3d3c48; stroke-width: 2; }             /* glass highlight */
.peacock .eye-g ellipse { fill: #1d1c24; stroke: #3d3c48; stroke-width: 2; }
.peacock .n { opacity: 0; }
.peacock .t { stroke: var(--c); stroke-width: 8; filter: url(#fx-neon); }
.peacock .k { stroke: var(--core); stroke-width: 2.6; }
.peacock .eye-n ellipse { fill: var(--amber, #F2A33A); filter: url(#fx-neon); }
.peacock .dot { fill: var(--core); }
.peacock .feather   { --c: var(--lab, #5CE1E6); --core: #E6FEFF; }
.peacock .sign-body { --c: var(--amber, #F2A33A); --core: #FFF1D6; }
.peacock .letters text {
  font-family: 'Bebas Neue', Impact, 'Arial Narrow', sans-serif; font-size: 104px; letter-spacing: .06em;
  fill: #24232c; stroke: #3d3c48; stroke-width: 1.5; paint-order: stroke; color: #24232c;
}
/* states: .on = body + lettering lit (default); .feather.lit set by the engine; .just-lit / .just-dark play once */
.peacock .feather.lit .n,
.peacock.on .sign-body .n { opacity: 1; }
.peacock.on .letters text { fill: #FFE6EA; stroke: var(--her, #E0273F); stroke-width: 7; filter: url(#fx-neon); color: #FFE6EA; }
/* light spill: the sign lights the room a little more with every feather (the cumulative-risk meter) */
.peacock .spill { opacity: 0; transition: opacity calc(900ms * var(--motion, 1)) var(--ease, cubic-bezier(.2, .8, .2, 1)); }
.peacock:has(.f1.lit) .spill { opacity: .06; }
.peacock:has(.f2.lit) .spill { opacity: .12; }
.peacock:has(.f3.lit) .spill { opacity: .18; }
.peacock:has(.f4.lit) .spill { opacity: .24; }
.peacock:has(.f5.lit) .spill { opacity: .30; }
.peacock.no-spill .spill { display: none; }
.peacock .feather.just-lit .n { animation: art-flicker-on calc(1s * var(--motion, 1)) steps(1, end) both; }
.peacock .feather.just-dark .n { animation: art-die-out calc(1.4s * var(--motion, 1)) steps(1, end) both; }
.peacock.switch-on .sign-body .n { animation: art-flicker-on calc(1.2s * var(--motion, 1)) steps(1, end) both; }
.peacock.switch-on .letters text { animation: art-letters-on calc(1.6s * var(--motion, 1)) calc(.3s * var(--motion, 1)) steps(1, end) both; }

/* ---------- neon word (S1 "ALL IN") ----------
   The visible glyphs are the lit .ch spans (pale core, amber halo → passes 7:1). Unlit glass is a ::before copy of the
   text that does not count as text. Add .on to flicker in (staggered by --i); .lit = lit with no animation. */
.neon-word { position: relative; display: inline-block; white-space: pre; color: var(--neon-core, #FFF3DF); }
.neon-word::before { content: attr(data-text); position: absolute; left: 0; top: 0; color: #1d1a18; -webkit-text-stroke: .012em #3a332c; }
.neon-word .ch { position: relative; opacity: 0;
  text-shadow: 0 0 .02em #fff, 0 0 .07em var(--glow, #F2A33A), 0 0 .2em var(--glow, #F2A33A), 0 0 .55em color-mix(in srgb, var(--glow, #F2A33A) 55%, transparent); }
.neon-word.lit .ch { opacity: 1; }
.neon-word.on .ch { animation: art-flicker-on calc(1.1s * var(--motion, 1)) calc((var(--i) * 170ms + 150ms) * var(--motion, 1)) steps(1, end) both; }
.neon-word.on .ch.g { animation: art-flicker-glitch calc(2.6s * var(--motion, 1)) calc((var(--i) * 170ms + 150ms) * var(--motion, 1)) steps(1, end) both; }
.neon-word .ch.sp { opacity: 0; }

/* ---------- glint: one-shot light sweep over a round prop (wrap with ALLIN.art.glint) ---------- */
:where(.glint) { position: relative; display: inline-block; }
.glint::after {
  content: ""; position: absolute; inset: 4%; pointer-events: none; border-radius: 50%;
  background: linear-gradient(115deg, transparent 38%, rgba(255, 255, 255, .8) 50%, transparent 62%) no-repeat;
  background-size: 300% 100%; background-position: 130% 0; mix-blend-mode: screen; opacity: 0;
  animation: art-glint calc(1.1s * var(--motion, 1)) var(--glint-delay, .25s) var(--ease, cubic-bezier(.2, .8, .2, 1)) both;
}

/* ---------- ambient twinkle for the backbar glint spots (off unless a scene sets --twinkle: running) ---------- */
.art-twinkle { animation: art-twinkle 7s ease-in-out infinite; animation-play-state: var(--twinkle, paused); }

/* ---------- peacock-tail unfurl (inline the symbol: ALLIN.art.inline('peacock-tail', 'unfurl')) ---------- */
.unfurl .feather-ray { animation: art-unfurl calc(.9s * var(--motion, 1)) calc(var(--i) * 90ms * var(--motion, 1)) var(--ease, cubic-bezier(.2, .8, .2, 1)) both; }

/* ---------- keyframes ---------- */
@keyframes art-flicker-on {
  0% { opacity: 0; } 8% { opacity: .9; } 12% { opacity: .1; } 22% { opacity: 1; } 27% { opacity: .25; }
  40% { opacity: 1; } 46% { opacity: .6; } 52%, 100% { opacity: 1; }
}
@keyframes art-flicker-glitch {
  0% { opacity: 0; } 5% { opacity: .9; } 9% { opacity: 0; } 18% { opacity: 1; } 22% { opacity: .2; } 30% { opacity: 1; }
  62% { opacity: 1; } 64% { opacity: .15; } 67% { opacity: 1; } 70% { opacity: .35; } 74%, 100% { opacity: 1; }
}
@keyframes art-die-out {
  0% { opacity: 1; } 10% { opacity: .3; } 16% { opacity: 1; } 30% { opacity: .5; } 34% { opacity: .9; }
  52% { opacity: .15; } 58% { opacity: .6; } 72% { opacity: .05; } 78% { opacity: .3; } 86%, 100% { opacity: 0; }
}
@keyframes art-letters-on {
  0% { fill: #24232c; stroke: #3d3c48; stroke-width: 1.5; }
  12%, 30%, 52%, 100% { fill: #FFE6EA; stroke: var(--her, #E0273F); stroke-width: 7; }
  20%, 38% { fill: #24232c; stroke: #3d3c48; stroke-width: 1.5; }
}
@keyframes art-glint { 0% { opacity: 1; background-position: 130% 0; } 100% { opacity: 1; background-position: -30% 0; } }
@keyframes art-twinkle { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
@keyframes art-unfurl { from { transform: translate(260px, 250px) rotate(0deg) scale(.2); opacity: 0; } to { transform: translate(260px, 250px) rotate(var(--a)) scale(1); opacity: 1; } }

/* ---------- instant (engine snapping) and reduced motion ---------- */
.instant .peacock .n, .instant .peacock .letters text, .instant .neon-word .ch, .instant .glint::after,
.instant .unfurl .feather-ray, .instant svg.art.icon-lit { animation: none !important; }
.instant .peacock .spill { transition: none; }
.instant .neon-word.on .ch:not(.sp) { opacity: 1; }
.rm .art-twinkle { animation: none; }
/* reduced motion: every duration above is multiplied by --motion (0.3 under html.rm, tokens.css); loops are frozen */
/* ---- p2/_kit.css ---- */
/* src/scenes/_kit.css — styles for the shared scene kit (src/scenes/_kit.js). Global, but every selector matches only
   kit-* classes. Loads after art.css and before the s*.css scene files, so a scene can override anything here with a
   selector scoped under .scene[data-id="Sx"]. Docs: src/scenes/KIT.md. */

/* ---------- mood-aware geometry (text-safe area, inset position) ---------- */
#stage { --kit-safe-l: 120px; --kit-safe-r: 120px; --kit-safe-t: 170px; --kit-safe-b: 170px; --inset-top: 190px; }
#stage[data-mood="lab"], #stage[data-mood="room"], #stage[data-mood="black"] {
  --kit-safe-l: 96px; --kit-safe-r: 96px; --kit-safe-t: 72px; --kit-safe-b: 72px; --inset-top: 112px;
}

/* ================================================================== SETS */
.kit-cast, .kit-prop, .kit-castshadow { position: absolute; }
.kit-cast > svg, .kit-prop > svg { display: block; }
.kit-castshadow { pointer-events: none; }

/* ---- bar ---- */
.kit-bar .kit-set { position: absolute; inset: 0; }
.kit-bar-haze {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(34% 46% at 24.5% 34%, rgba(255, 196, 120, .09), rgba(255, 196, 120, 0) 70%),
    radial-gradient(60% 40% at 50% 0%, rgba(0, 0, 0, .35), rgba(0, 0, 0, 0) 70%),
    linear-gradient(180deg, rgba(18, 9, 4, 0) 45%, rgba(18, 9, 4, .38) 100%);
}
.kit-door { position: absolute; right: -90px; top: 150px; width: 440px; height: 846px; }
.kit-door > svg { width: 100%; height: 100%; }
.kit-sign { position: absolute; }
.kit-sign > svg { width: 100%; height: auto; display: block; }
.kit-counter { position: absolute; left: 0; top: 800px; width: 1920px; height: 360px; }
.kit-hero-clip { position: absolute; inset: 0; clip-path: inset(-200px -200px 280px -200px); }   /* hero cast stays behind the counter line (y 800) */
.kit-hero-clip.front { clip-path: none; }
/* foreground (depth 4): out-of-focus bokeh + a dark bottle / glass edge — static, no loops */
.kit-fg { pointer-events: none; }
.kit-bokeh { position: absolute; border-radius: 50%; opacity: .55;
  background: radial-gradient(circle, rgba(255, 190, 110, .42) 0, rgba(242, 163, 58, .16) 50%, rgba(242, 163, 58, 0) 70%); }
.kit-bokeh.b1 { left: 36px;   top: 176px; width: 150px; height: 150px; }
.kit-bokeh.b2 { left: 1700px; top: 208px; width: 104px; height: 104px; opacity: .38; }
.kit-bokeh.b3 { left: 1560px; top: 150px; width: 60px;  height: 60px;  opacity: .45; }
.kit-fg-bottle { position: absolute; left: -92px; top: 560px; width: 180px; height: 558px; filter: blur(6px); overflow: visible; }
.kit-fg-glass  { position: absolute; right: -70px; top: 820px; width: 300px; height: 281px; filter: blur(7px); overflow: visible; }

/* ---- park ---- */
.kit-park .kit-qp { position: absolute; left: 1000px; top: 193px; width: 1000px; height: 667px; }
.kit-park .kit-ground { position: absolute; left: 0; top: 860px; width: 1920px; height: 300px; }
.kit-park-fg {
  position: absolute; left: -60px; bottom: -24px; width: 560px; height: 120px; filter: blur(4px);
  background: linear-gradient(180deg, #0b0f14, #05070a 60%); border-top: 3px solid rgba(255, 192, 106, .28);
  transform: skewX(-14deg); border-radius: 6px;
}

/* ---- lab ---- */
.kit-lab-haze { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(48% 46% at 30% 42%, rgba(92, 225, 230, .07), rgba(92, 225, 230, 0) 70%),
              linear-gradient(180deg, rgba(0, 0, 0, .25), rgba(0, 0, 0, 0) 30%); }
.kit-monitor { position: absolute; }
.kit-monitor > svg { display: block; }
.kit-screen { position: absolute; overflow: hidden; }
.kit-participant { position: absolute; left: -40px; top: 690px; width: 620px; height: 537px; }

/* ---- docFrame (lab INSERT dressing; the engine draws the corner marks and the REC dot — no timecode digits) ---- */
.kit-doc { position: absolute; inset: 0; pointer-events: none; z-index: 18; }
.kit-doc-tick { position: absolute; background: rgba(92, 225, 230, .45); }
.kit-doc-tick.t, .kit-doc-tick.b { left: 50%; width: 3px; height: 26px; margin-left: -1.5px; }
.kit-doc-tick.t { top: 40px; } .kit-doc-tick.b { bottom: 40px; }
.kit-doc-tick.l, .kit-doc-tick.r { top: 50%; height: 3px; width: 26px; margin-top: -1.5px; }
.kit-doc-tick.l { left: 40px; } .kit-doc-tick.r { right: 40px; }
.kit-doc-meter { position: absolute; left: 104px; bottom: 40px; height: 30px; display: flex; align-items: flex-end; gap: 5px; opacity: .55; }
.kit-doc-meter i { width: 7px; background: var(--lab); border-radius: 1px; }
.kit-doc-meter i:nth-child(1) { height: 30%; } .kit-doc-meter i:nth-child(2) { height: 55%; } .kit-doc-meter i:nth-child(3) { height: 80%; }
.kit-doc-meter i:nth-child(4) { height: 62%; } .kit-doc-meter i:nth-child(5) { height: 40%; } .kit-doc-meter i:nth-child(6) { height: 18%; opacity: .5; }
.kit-focus { position: absolute; }
.kit-focus .c { position: absolute; width: 44px; height: 44px; border: 0 solid var(--lab); filter: drop-shadow(0 0 6px rgba(92, 225, 230, .6)); }
.kit-focus .tl { left: 0; top: 0; border-left-width: 4px; border-top-width: 4px; }
.kit-focus .tr { right: 0; top: 0; border-right-width: 4px; border-top-width: 4px; }
.kit-focus .bl { left: 0; bottom: 0; border-left-width: 4px; border-bottom-width: 4px; }
.kit-focus .br { right: 0; bottom: 0; border-right-width: 4px; border-bottom-width: 4px; }
.kit-focus .x { position: absolute; left: 50%; top: 50%; width: 24px; height: 24px; margin: -12px 0 0 -12px; opacity: .6;
  background: linear-gradient(var(--lab), var(--lab)) 50% 0 / 2px 100% no-repeat, linear-gradient(var(--lab), var(--lab)) 0 50% / 100% 2px no-repeat; }

/* ---- case file room (S18, S20, S21) ---- */
.kit-case-wall { position: absolute; inset: 0;
  background:
    radial-gradient(32% 56% at 27% 48%, rgba(242, 163, 58, .17), rgba(242, 163, 58, 0) 72%),
    radial-gradient(32% 56% at 73% 48%, rgba(92, 225, 230, .14), rgba(92, 225, 230, 0) 72%),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, .022) 0 2px, rgba(255, 255, 255, 0) 2px 192px),
    linear-gradient(180deg, #13131a 0%, #0c0c11 62%, #08080b 100%); }
.kit-case-wall.nosplit { background:
    radial-gradient(46% 60% at 50% 44%, rgba(243, 238, 228, .08), rgba(243, 238, 228, 0) 72%),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, .022) 0 2px, rgba(255, 255, 255, 0) 2px 192px),
    linear-gradient(180deg, #13131a 0%, #0c0c11 62%, #08080b 100%); }
.kit-case-lamp { position: absolute; left: 50%; top: 0; width: 0; height: 0; }
.kit-case-lamp .cord { position: absolute; left: -1px; top: 0; width: 2px; height: 150px; background: #2a2a33; }
.kit-case-lamp .shade { position: absolute; left: -70px; top: 146px; width: 140px; height: 46px; background: linear-gradient(#24242c, #121218);
  clip-path: polygon(28% 0, 72% 0, 100% 100%, 0 100%); }
.kit-case-lamp .shade::after { content: ''; position: absolute; left: 22%; right: 22%; bottom: 0; height: 6px; border-radius: 50%; background: #FFE9C2; box-shadow: 0 0 22px 6px rgba(255, 220, 160, .5); }
.kit-case-lamp .cone { position: absolute; left: -560px; top: 186px; width: 1120px; height: 680px; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 236, 200, .085), rgba(255, 236, 200, .02) 70%, rgba(255, 236, 200, 0));
  clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%); }
.kit-case-desk { position: absolute; left: 0; right: 0; top: 846px; height: 240px;
  background: linear-gradient(180deg, #1b1813 0, #0d0c0a 34%, #070707 100%); border-top: 2px solid rgba(243, 238, 228, .16);
  box-shadow: 0 -24px 60px rgba(0, 0, 0, .5); }

/* ---- room (S22, S23): house lights, still ---- */
.kit-room-wall { position: absolute; inset: 0;
  background:
    radial-gradient(70% 58% at 50% -6%, rgba(243, 238, 228, .075), rgba(243, 238, 228, 0) 70%),
    radial-gradient(40% 30% at 12% 14%, rgba(242, 163, 58, .06), rgba(242, 163, 58, 0) 70%),
    linear-gradient(180deg, #121319 0%, #0c0d12 70%, #0a0a0e 100%); }
.kit-room-bar { position: absolute; inset: 0; opacity: .16; }
.kit-room-veil { position: absolute; inset: 0; background: radial-gradient(60% 60% at 50% 55%, rgba(12, 13, 18, .55), rgba(12, 13, 18, .2) 70%, rgba(12, 13, 18, .5)); }
.kit-room-floor { position: absolute; left: 0; right: 0; bottom: 0; height: 200px;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, .45)); }
.kit-room-sign { position: absolute; opacity: .7; }
.kit-room-sign > svg { width: 100%; height: auto; display: block; }

/* ---- desat sheet (S3) ---- */
.kit-desat { position: absolute; inset: 0; background: #808080; mix-blend-mode: saturation; opacity: 0; pointer-events: none; }
.scene .kit-desat[data-rv] { translate: none; }
.scene .kit-desat[data-rv="on"] { opacity: 0;
  animation: kit-desat calc((var(--hold, 1500ms) + 900ms) * var(--motion, 1)) var(--ease) calc(var(--d) * var(--motion, 1)) both; }
@keyframes kit-desat { 0% { opacity: 0; } 22% { opacity: var(--amt, .3); } 78% { opacity: var(--amt, .3); } 100% { opacity: 0; } }

/* ================================================================== TYPE */

/* ---- dock: a grid on the mood's text-safe area; lines share row 1, captions row 2 ---- */
.kit-dock {
  position: absolute; left: var(--kit-safe-l); right: var(--kit-safe-r); z-index: 20; pointer-events: none;
  display: grid; grid-template-columns: minmax(0, 1fr); row-gap: 20px; justify-items: center;
}
.kit-dock > * { grid-column: 1; grid-row: var(--row, 1); }
.kit-dock.at-bottom { bottom: calc(var(--kit-safe-b) + 16px); align-items: end; }
.kit-dock.at-top { top: calc(var(--kit-safe-t) + 16px); align-items: start; }
.kit-dock.at-center { top: 50%; transform: translateY(-50%); align-items: center; }
.kit-dock.al-left { justify-items: start; }
/* the documentary subtitle rule (lab mood): ONE anchor for every lab line — left edge x 180, top band y 120,
   left-aligned, 72 px Inter 700 (tracking -0.01em from .t-line), scrim behind it */
.kit-dock.at-lab { left: 180px; right: var(--kit-safe-r, 96px); top: 120px; bottom: auto; transform: none; align-items: start; justify-items: start; }
.kit-dock.at-lab .kit-line { text-align: left; }
.kit-dock.al-right { justify-items: end; }

/* ---- line: the main sentence of a state ---- */
/* ONE size for every main line: 72 px; the single fallback is 64 px (.fit) for a line that must stay on one line */
.kit-line {
  position: relative; isolation: isolate; margin: 0; max-width: 1560px;
  font-size: var(--ls, 72px); line-height: 1.12; text-align: center; color: var(--bone);
  text-shadow: 0 2px 3px rgba(0, 0, 0, .55), 0 0 28px rgba(0, 0, 0, .7);
}
.kit-line::before {
  content: ''; position: absolute; inset: -40px -120px -44px; z-index: -1; pointer-events: none;

.kit-caption.t-amber { color: var(--amber); } .kit-caption.t-lab { color: var(--lab); } .kit-caption.t-warn { color: var(--warn); }

/* ---- display titles (Bebas >= 110 px) ---- */

/* ---- rubber stamp imprint (S19 NO EFFECT.) ---- */

/* ---- the documentary slate (S7, S13) ---- */
.kit-slate-bg .kit-slate-dim { position: absolute; inset: 0;

.kit-slate {

  border: 2px solid rgba(92, 225, 230, .42);

.kit-slate:not([data-rv="pre"]):not([data-rv="off"]):not([data-rv="post"]) .kit-slate-clap i { animation: kit-clap calc(620ms * var(--motion, 1)) cubic-bezier(.5, 0, .7, .4) calc(120ms * var(--motion, 1)) both; }

.kit-slate-body { padding: 44px 64px 50px; }
.kit-slate-title { margin: 0; font: 400 var(--fs-slate, 150px)/.9 var(--font-display); letter-spacing: .05em; text-transform: uppercase; color: var(--bone);
  text-shadow: 0 0 .02em rgba(255, 255, 255, .5), 0 0 .16em rgba(92, 225, 230, .35); padding-top: .04em; }
.kit-slate-title .n { color: var(--lab); }
.kit-slate-place { margin: 26px 0 0; font: 700 64px/1.1 var(--font-body); color: var(--lab); letter-spacing: -.005em; }
.kit-slate-authors { margin: 14px 0 0; font: 700 64px/1.12 var(--font-body); color: var(--bone); letter-spacing: -.01em; text-wrap: balance; }
.kit-slate-foot { display: flex; align-items: center; gap: 30px; margin-top: 40px; padding-top: 26px; border-top: 2px solid rgba(92, 225, 230, .22); }
.kit-slate-journal { margin: 0; font: 600 40px/1.25 var(--font-body); color: #D9D3C7; font-style: italic; }
.kit-slate-badge { display: inline-flex; align-items: center; gap: 12px; flex: none; font: 700 40px/1 var(--font-body); color: var(--money);
  padding: 8px 22px 8px 12px; border: 2px solid rgba(124, 224, 122, .5); border-radius: 40px; }
.kit-slate-sweep { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(100deg, rgba(92, 225, 230, 0) 30%, rgba(200, 250, 252, .16) 48%, rgba(92, 225, 230, 0) 62%);
  background-size: 260% 100%; animation: kit-sweep calc(1400ms * var(--motion, 1)) var(--ease) calc(250ms * var(--motion, 1)) both; }
@keyframes kit-sweep { 0% { opacity: 1; background-position: 120% 0; } 100% { opacity: 1; background-position: -60% 0; } }

/* ---- ballot (S6, S15): key caps ---- */
.kit-ballot { display: flex; gap: 110px; justify-content: center; align-items: center; z-index: 20; }
.kit-ballot.auto { position: absolute; left: var(--kit-safe-l); right: var(--kit-safe-r); bottom: calc(var(--kit-safe-b) + 40px); }
.kit-ballot.stack { flex-direction: column; align-items: flex-start; gap: 36px; }
.kit-opt { display: flex; align-items: center; gap: 34px; position: relative; isolation: isolate; }
.kit-opt::before { content: ''; position: absolute; inset: -34px -70px -34px -40px; z-index: -1;
  background: radial-gradient(closest-side, rgba(7, 7, 11, .9), rgba(7, 7, 11, .7) 55%, rgba(7, 7, 11, 0)); }
.kit-key {

  text-shadow: 0 2px 3px rgba(0, 0, 0, .55); }
.scene.choice-A .opt-a .kit-key, .scene.choice-B .opt-b .kit-key {
  background: linear-gradient(180deg, #FFC46B, #F2A33A); color: #1a0f04;
  box-shadow: 0 10px 0 #6b4310, 0 16px 34px rgba(0, 0, 0, .7), 0 0 60px rgba(242, 163, 58, .7);
}
.scene.choice-A .opt-b, .scene.choice-B .opt-a { filter: brightness(.36) saturate(.4); }

/* ================================================================== GLYPHS */

/* ---- lightUp: dark glass → lit neon ---- */
.kit-light { position: relative; flex: none; }
.kit-light .kit-glass, .kit-light .kit-lit { position: absolute; inset: 0; }
.kit-light svg { width: 100%; height: 100%; }

/* ---- icon slots (S11, S17) ---- */
.kit-slots { display: flex; gap: 52px; justify-content: center; align-items: center; }
.kit-slots.auto { position: absolute; left: 0; right: 0; top: 440px; }
.kit-slot {
  position: relative; display: grid; place-items: center; border-radius: 30px; color: var(--lab);
  background: radial-gradient(80% 70% at 50% 30%, rgba(30, 44, 52, .9), rgba(8, 12, 16, .96) 70%);
  border: 2px solid rgba(243, 238, 228, .1);

.kit-slot-lip { position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(135deg, rgba(255, 255, 255, .07) 0, rgba(255, 255, 255, 0) 34%); }
.kit-slot-on { position: absolute; inset: -2px; border-radius: inherit; pointer-events: none;
  border: 2px solid currentColor; box-shadow: 0 0 28px color-mix(in srgb, currentColor 40%, transparent), inset 0 0 44px color-mix(in srgb, currentColor 16%, transparent); }
.scene .kit-slot-on[data-rv] { translate: none; }

/* ---- big arrow ---- */
.kit-arrow { display: block; flex: none; }
.kit-arrow svg { width: 100%; height: 100%; }

/* ---- outcome chip (S10) ---- */
.kit-chip {
  display: inline-flex; align-items: center; gap: 18px; height: 168px; padding: 0 22px 0 44px; border-radius: 28px;
  background: linear-gradient(180deg, rgba(18, 28, 34, .95), rgba(7, 11, 15, .96));
  border: 2px solid rgba(92, 225, 230, .5);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .6), 0 0 36px rgba(92, 225, 230, .16), 0 26px 60px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .08);
}
.kit-chip-t { font: 400 104px/1 var(--font-display); letter-spacing: .05em; color: var(--bone); padding-top: .07em; }
.kit-chip-a { display: block; width: 132px; height: 132px; }
.kit-chip.c-amber { border-color: rgba(242, 163, 58, .6); box-shadow: 0 0 0 1px rgba(0, 0, 0, .6), 0 0 36px rgba(242, 163, 58, .18), 0 26px 60px rgba(0, 0, 0, .55); }

/* ---- dial (S16): only the given values ---- */
.kit-dial { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
.kit-dial.panel { padding: 30px 46px 26px; border-radius: 30px;
  background: radial-gradient(90% 80% at 50% 35%, rgba(26, 22, 18, .95), rgba(8, 8, 11, .95) 75%);
  border: 2px solid rgba(255, 209, 102, .28);
  box-shadow: 0 30px 70px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .07), 0 0 40px rgba(255, 209, 102, .08); }
.kit-dial-l { margin: 0 0 6px; font: 700 52px/1.1 var(--font-body); color: var(--bone); text-align: center; white-space: nowrap;
  text-shadow: 0 2px 3px rgba(0, 0, 0, .6), 0 0 22px rgba(0, 0, 0, .7); }
.kit-needle { position: relative; width: var(--dial-w, 300px); }
.kit-needle svg { display: block; width: 100%; height: auto; }
/* two needles over the art's scale (its own needle hidden): ghost = where it started (from), lit = to, lit arc between */
.kit-dial-base .needle { display: none; }
.kit-dial-over { position: absolute; left: 0; top: 0; width: 100%; height: auto; overflow: visible; }
.kit-dial-over .kit-nd { transform-origin: 120px 136px; }
.kit-dial-over .kit-nd path { fill: none; stroke: var(--accent, currentColor); stroke-width: 8; stroke-linecap: round; }
.kit-dial-over .kit-nd.ghost path { stroke-width: 7; }
.kit-dial-over .kit-nd-ghost { opacity: .35; }
.kit-dial-over .kit-hub { fill: currentColor; }
.kit-dial-over .kit-arc { fill: none; stroke: color-mix(in srgb, currentColor 35%, #fff); stroke-width: 13; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 0; }
/* sweep mode: the lit needle leaves the ghost and sweeps to `to`, the arc draws behind it (same timing) */
.scene .kit-nd-sweep[data-rv], .scene .kit-nd-arc[data-rv] { opacity: 1; translate: none; }
.kit-nd-sweep .kit-nd { transform: rotate(var(--from)); transition: transform calc(.9s * var(--motion, 1)) var(--ease) calc(var(--sweep-d, 500ms) * var(--motion, 1)); }
.kit-nd-sweep[data-rv="on"] .kit-nd, .kit-nd-sweep[data-rv="post"] .kit-nd { transform: rotate(var(--to)); }
.kit-nd-arc[data-rv="pre"] .kit-arc { stroke-dashoffset: 100; }
.kit-nd-arc .kit-arc { transition: stroke-dashoffset calc(.9s * var(--motion, 1)) var(--ease) calc(var(--sweep-d, 500ms) * var(--motion, 1)); }
.kit-dial-v { margin: 6px 0 0; display: flex; align-items: baseline; justify-content: center; gap: 20px; font: 400 116px/1 var(--font-display); color: var(--warn); letter-spacing: .02em;
  text-shadow: 0 0 .1em rgba(255, 209, 102, .35); }
.kit-dial-v .kit-dial-from, .kit-dial-v .kit-dial-to { display: inline-flex; align-items: baseline; gap: 20px; }
.kit-dial-v .kit-dial-w { font: 600 44px/1 var(--font-body); color: var(--bone); letter-spacing: 0; text-shadow: none; }
/* optional group tag before a value (e.g. photo-landscape = control, photo-portrait = women's photos): pictorial, no words */
.kit-dial-tag { display: inline-block; width: 58px; height: 58px; align-self: center; flex: none; }
.kit-dial-tag svg { display: block; width: 100%; height: 100%; }

/* ---- hormone meter (S4, S10): a glass tube, orange neon fill, no scale ---- */
.kit-meter { position: relative; width: 30px; height: 320px; border-radius: 15px; flex: none;
  background: linear-gradient(90deg, #0c0d12, #1a1b24 50%, #0c0d12); border: 2px solid #33343f;
  box-shadow: inset 0 0 10px rgba(0, 0, 0, .8), 0 0 0 1px rgba(0, 0, 0, .5); }
.kit-meter > i { position: absolute; left: 5px; right: 5px; bottom: 5px; top: 5px; border-radius: 10px; transform-origin: 50% 100%;
  background: linear-gradient(0deg, #FF6A1A, #FF9A4D); box-shadow: 0 0 14px rgba(255, 106, 26, .85), 0 0 34px rgba(255, 106, 26, .45); }
.kit-meter > .kit-meter-zero { transform: scaleY(.035); }
.kit-meter > .kit-meter-cap { inset: auto 6px 12px; height: 2px; background: rgba(255, 255, 255, .5); box-shadow: none; transform: none; }
.scene .kit-meter > .kit-meter-twitch[data-rv] { translate: none; transform: scaleY(.035); }
.scene .kit-meter > .kit-meter-twitch[data-rv="on"] { animation: kit-twitch calc(1300ms * var(--motion, 1)) var(--ease) both; }
@keyframes kit-twitch { 0% { transform: scaleY(.035); } 16% { transform: scaleY(.2); } 30% { transform: scaleY(.07); } 46% { transform: scaleY(.15); } 70%, 100% { transform: scaleY(.05); } }
.scene .kit-meter > .kit-meter-rise[data-rv] { opacity: 1; translate: none; transform: scaleY(.035);

.scene .kit-meter > .kit-meter-rise[data-rv="on"], .scene .kit-meter > .kit-meter-rise[data-rv="post"] { transform: scaleY(.9); opacity: 1; }

/* ---- chain (S10 mediation) ---- */
.kit-chain { display: flex; align-items: center; }
.kit-node {
  font: 400 88px/1 var(--font-display); letter-spacing: .05em; color: var(--bone); padding: 28px 38px 20px; border-radius: 20px;
  background: rgba(8, 10, 14, .9); border: 2px solid rgba(243, 238, 228, .28); white-space: nowrap;

/* the link box is tall so the wipe's clip-path (-10% vertical) never cuts the arrowhead */

.kit-link.hot { color: var(--hormone); filter: drop-shadow(0 0 8px rgba(255, 106, 26, .9)); }

.kit-card-wrap { perspective: 1800px; }
.kit-card-wrap.auto { position: absolute; left: var(--kit-safe-l); right: var(--kit-safe-r); top: 400px; display: flex; justify-content: center; }

  background: linear-gradient(180deg, #121b21, #091014); border: 2px solid rgba(92, 225, 230, .5);

.kit-card-t { margin: 0; font: 700 62px/1.16 var(--font-body); color: var(--bone); }

/* ---- Peacock inset (S10 b5, S19 b4): a picture-in-picture cut back to the bar ---- */
.kit-inset {

/* S1 cold open — every selector scoped to the scene. */

  position: absolute; left: 360px; top: 300px; width: 1200px; height: 560px; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255, 170, 70, .30), rgba(242, 163, 58, .10) 55%, rgba(242, 163, 58, 0));

  position: absolute; left: 560px; top: 430px; width: 800px; height: 300px; pointer-events: none;

/* ---- styles/artifact.css ---- */
/* ALL IN — claude.ai Artifact build only (`node build.js --artifact`); never part of the USB build.
   The publisher wraps our fragment in its own skeleton: light color-scheme, :root padded top/bottom by the safe-area
   insets, body margin 0 with an off-white 14px system font. The film is single-theme dark by choice, so the ground is
   painted explicitly here; sizing stays on height:100% and the fixed #viewport (never 100vh). */
:root { color-scheme: dark; background: #000; }
html, body { background: #000; color: var(--bone); }
html { box-sizing: border-box; }            /* the skeleton's safe-area padding sits inside height:100%: no overflow */
body { font-size: 16px; line-height: normal; }   /* undo the skeleton's 14px so inherited sizes match the USB build */
/* the stage-fit (core.js) reads this box: below the top inset, above the bottom one, minus a 16 px gutter per side */
#viewport { top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); }
/* the boot hint sits over S1 b1 for 3 s, then fades out completely (on S0 it still dims to 8%) */
html.artifact #hint:not(.show):not(.dim) { transition: opacity calc(900ms * var(--motion)) ease-in-out; }
/* over a scene (S1 b1 at rest, or a #S deep link) the hint sits in the bottom letterbox band, clear of the title and
   tagline; on S0 it stays centred as in the USB build */
html.artifact #hint.over {
  top: auto; bottom: 0; height: var(--bar-h); transform: none;
  display: flex; align-items: center; justify-content: center;
}
